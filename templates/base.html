<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Career Guidance & Opportunity Navigator{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <span class="brand-icon">✨</span> AI Career Navigator
            </a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/api/profile/ui">Student Profile</a>
                <a href="/career/guidance">Career Guidance</a>
                <a href="/education/pathways">Education Pathways</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 AI-Agentic Career Guidance & Opportunity Navigator. Hackathon Edition.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
